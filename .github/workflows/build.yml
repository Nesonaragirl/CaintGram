name: Build APK (Debug)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept SDK licenses (non-interactive)
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Cache Android SDK components (NDK/CMake)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.10.2.4988404
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: android-sdk-ndk27-cmake3.10-platform35-buildtools35

      - name: Install SDK components (platform, build-tools, NDK, CMake)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.10.2.4988404"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # this is the one that actually matters - native C++ (boringssl/ffmpeg/webrtc) was
      # getting fully recompiled every single run, which is where most of the 45min went
      - name: Cache ccache (native C++ compile cache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-arm64-${{ github.sha }}
          restore-keys: |
            ccache-arm64-

      - name: Install ccache
        run: sudo apt-get update -y && sudo apt-get install -y ccache

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build arm64 debug APK (fast, single-ABI - covers Redmi/HyperOS and virtually all modern phones)
        run: ./gradlew :TMessagesProj_App:assembleArm64Debug --stacktrace --build-cache --parallel
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: ccache stats
        run: ccache --show-stats

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgram-app-debug-arm64
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
